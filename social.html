<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="eventra images/logo favicon.jpg" rel="icon" type="image/jpg"/>
  <title>Eventra - Social</title>
  <link rel="stylesheet" href="social.css"/>
</head>
<body>
  <script src="social.js" type="module"></script>

  <!-- Login Gate Modal -->
  <div id="login-gate" class="modal-overlay" style="display:none;">
    <div class="login-popup">
      <button id="login-gate-close" class="close-btn">×</button>
      <h2>Please log in</h2>
      <p>You need an account to continue.</p>

      <div class="login-popup-buttons">
        <a href="login.html" class="btn-primary">Log in</a>
        <a href="signup.html" class="btn-ghost">Sign up</a>
      </div>
    </div>
  </div>

  <!-- Market Card Picker Modal -->
  <div id="market-picker" class="market-overlay" style="display:none;">
    <div class="market-search-container">
      <input id="market-search" type="text" placeholder="Search markets...">
    </div>

    <div id="market-cat-pills" class="cat-pills"></div>
    <div id="market-list" class="market-picker-list"></div>

    <button id="market-picker-close" class="market-close-btn">×</button>
  </div>

  <!-- NAVBAR (FIXED STRUCTURE) -->
  <nav class="nav">
    <div class="container">
      <div class="nav-inner">

        <a class="brand" href="#">
          <div class="logo"></div>
          <strong>Eventra</strong>
        </a>

      <div class="nav-links">
        <a href="events.html">Markets</a>
        <a href="events.html">CCNY</a>
        <a href="social.html" class="active">Community</a>
        <a href="account.html" id="nav-account-link">Account</a>

      </div>

        <div class="nav-actions-right">
          <span id="nav-auth">
            <a class="btn-nav-ghost" href="login.html">Log in</a>
            <a class="btn-nav-primary" href="signup.html">Sign up</a>
          </span>

          <span id="nav-user" style="display:none;">
            <div class="avatar" id="nav-avatar"></div>
          </span>
        </div> <!-- THIS WAS MISSING -->

      </div>
    </div>
  </nav>

  <div class="page-layout">

    <!-- Left Sidebar -->
    <aside class="left-sidebar">
      <div class="sidebar-heading">Browse</div>
      <a class="sidebar-link" href="events.html">All Markets</a>
      <a class="sidebar-link" href="events.html">CCNY</a>
      <a class="sidebar-link" href="events.html">Sports</a>
      <a class="sidebar-link" href="events.html">Politics</a>

      <div class="sidebar-divider"></div>
      <div class="sidebar-heading">Trending</div>
      <div id="sidebar-markets"></div>
    </aside>

    <!-- FEED COLUMN -->
    <div class="feed-col">

      <div class="page-title">Community</div>

      <div class="section">
        <div class="user-post-row">
          <div class="avatar">JD</div>
          <div class="field">
            <textarea placeholder="Write something..."></textarea>
          </div>
        </div>

        <div id="attached-market-preview" class="attached-market-preview" style="display:none">
          <div id="attached-market-content" class="attached-market-content"></div>
          <button id="detach-market-btn" class="detach-btn" aria-label="Remove market">✕</button>
        </div>

        <div class="save-row">
          <div class="composer-btns">
            <button class="btn-attach" id="attach-market-btn">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
              </svg>
              Attach Market
            </button>

            <div class="btn-upload">
              <label for="file-upload">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
                Images
              </label>
              <input id="file-upload" type="file" accept="image/png, image/jpeg, image/gif"/>
            </div>
          </div>

          <button class="btn-post" id="post-btn">Post</button>
        </div>
      </div>

      <div class="time-tabs">
        <div class="time-tab active">Now</div>
        <div class="time-tab">Today</div>
        <div class="time-tab">This Week</div>
        <div class="time-tab">This Month</div>
      </div>

      <div class="posts-feed">
        <div class="container" id="posts-feed"></div>
      </div>

    </div>
  </div>

  <footer>Eventra · static mock · HTML + CSS only</footer>

</body>
</html>
